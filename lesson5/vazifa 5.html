
<!DOCTYPE html>

    <style>

        .nom {

        .chap {
            width: 28%;

        .chap h2 {

        .profil-rasm {
            width: 165px;

        }




        .galereya {

        .rasmlar {

        }

        .rasm {

            background-color: white;

            padding: 5px;

        .rasm img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 10px;
        }


        

        .audio {
            width: 48%;
            height: 40px;
            background-color: white;
            border: 3px solid #3156aa;
            border-radius: 15px;
            padding: 3px;
        }

        .audio audio {
            width: 100%;
            height: 30px;
        }


        

        .video {
            width: 350px;
            height: 190px;
            border: 4px solid #3156aa;

        }

        .video video {
            width: 100%;
            height: 100%;

        .footer {

        .yil {

        .yaratuvchi {
            width: 25%;

</head>
